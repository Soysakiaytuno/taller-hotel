<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Estadia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container mt-4">
    <a href="../../index.html" class="btn btn-outline-secondary shadow-sm">
        &larr; Volver al Menú Principal
    </a>
</div>
<div class="container bg-white p-4 shadow rounded">
    <h3 class="mb-4">Registrar Nueva Estadia</h3>
    <form id="formReserva">

        <div class="card mb-4 shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">1. Seleccionar Habitaciones</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label>Tipo de Habitación</label>
                        <select id="tipoHabitacion" class="form-select">
                            <option value="">Cargando catálogo...</option>
                            </select>
                    </div>
                    <div class="col-md-5">
                        <label>Habitación Disponible</label>
                        <select id="habitacionEspecifica" class="form-select" disabled>
                            <option value="">Primero seleccione el tipo...</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="button" id="btnAgregarHabitacion" class="btn btn-dark w-100" disabled>
                            + Agregar
                        </button>
                    </div>
                </div>

                <h6 class="mt-4 border-bottom pb-2">Habitaciones seleccionadas</h6>
                <ul id="listaCarrito" class="list-group mb-3">
                    <li class="list-group-item text-muted text-center" id="carritoVacio">
                        Aún no has agregado habitaciones.
                    </li>
                </ul>
                <div class="d-flex justify-content-between text-success">
                    <strong>Capacidad Total:</strong> 
                    <span id="capacidadTotalVisual">0 personas</span>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0">2. Fechas y Huéspedes</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label>Documentación del Cliente</label>
                        <input type="text" id="documentacionCliente" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label>Ingreso</label>
                        <input type="date" id="fechaIngreso" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label>Salida</label>
                        <input type="date" id="fechaSalida" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label>Huéspedes</label>
                        <input type="number" id="cantidadPersonas" class="form-control" min="1" required>
                    </div>
                </div>

                <div id="contenedorHuespedes"></div>
            </div>
        </div>

        <div id="contenedorHuespedes" class="mb-4">
            </div>

        <div id="alertaReserva" class="alert d-none"></div>
        
        <button type="submit" class="btn btn-success w-100">Confirmar Reserva</button>
    </form>
</div>

<script src="roomSelectionMediator.js"></script> 
<script src="listaHabitaciones.js"></script> 
<script src="reserva.js"></script>
</body>
</html>
