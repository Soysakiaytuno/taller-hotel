<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hotel | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <a href="index.html" class="btn btn-outline-secondary shadow-sm">
        &larr; Volver al Menú Principal
    </a>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Registrar Nuevo Cliente</h5>
                </div>
                <div class="card-body">
                    <form id="formRegistroCliente">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" required>
                        </div>
                        <div class="mb-3">
                            <label for="documento" class="form-label">Documento de Identidad</label>
                            <input type="text" class="form-control" id="documento" required>
                        </div>
                        
                        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

                        <button type="submit" class="btn btn-primary w-100">Guardar Cliente</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
